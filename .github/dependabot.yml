version: 2
updates:
  - package-ecosystem: npm
    directory: /webhid
    schedule:
      interval: weekly
    ignore:
      # Next 16.3's lint stack currently supports ESLint 9 and TypeScript <6.1.
      - dependency-name: eslint
        versions:
          - ">=10"
      - dependency-name: typescript
        versions:
          - ">=7"
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /host
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
